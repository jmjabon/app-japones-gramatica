<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>KikuNihongo Gramática</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="h-[100dvh] bg-slate-50 text-slate-800 font-sans antialiased overflow-x-hidden selection:bg-indigo-100 show-furigana show-romaji show-es flex flex-col">
  
  <nav class="fixed top-0 w-full bg-white/90 backdrop-blur-md border-b border-slate-200 z-50 pt-[max(env(safe-area-inset-top),10px)]">
    <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
      <h1 class="font-bold text-lg text-indigo-900 flex items-center gap-2">
        <i data-lucide="book-open" class="w-5 h-5"></i> Gramática
      </h1>
      <div class="flex items-center gap-2">
        <button id="toggle-furigana" class="text-xs font-bold px-2 py-1.5 rounded-lg bg-rose-50 text-rose-600 border border-rose-200 active:scale-95 transition-all">あ</button>
        <button id="toggle-romaji" class="text-xs font-bold px-2 py-1.5 rounded-lg bg-indigo-50 text-indigo-600 border border-indigo-200 active:scale-95 transition-all">A</button>
        <button id="toggle-es" class="text-xs font-bold px-2 py-1.5 rounded-lg bg-emerald-50 text-emerald-600 border border-emerald-200 active:scale-95 transition-all">ES</button>
        <button id="btn-settings" class="ml-1 p-2 text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-xl active:scale-95 transition-all"><i data-lucide="settings" class="w-5 h-5"></i></button>
      </div>
    </div>
  </nav>

  <main id="app-view" class="flex-1 mt-[calc(env(safe-area-inset-top)+3.5rem)] pb-[max(1.5rem,env(safe-area-inset-bottom))] max-w-3xl mx-auto w-full px-4 overflow-y-auto">
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
